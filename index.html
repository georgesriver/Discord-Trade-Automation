<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Market Pulse · TradeForge</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="header">
    <div class="logo">Market Pulse</div>
    <div class="date" id="currentDate"></div>
    <div class="header-right">
      <div class="status"><span class="dot"></span> Live</div>
      <div class="signal-badge" id="signalCount">信号 0</div>
    </div>
  </header>

  <main class="grid">
    <!-- Left Column -->
    <div class="col-left">
      <!-- Market Overview -->
      <section class="card overview">
        <h2>Market Overview</h2>
        <div class="chart-box" id="overviewChart">
          <canvas id="spxChart" width="400" height="120"></canvas>
        </div>
        <div class="indices" id="indices"></div>
      </section>

      <!-- Biggest Movers -->
      <section class="card movers">
        <h2>Biggest Movers</h2>
        <div class="tabs">
          <button class="tab active" data-tab="active">Active</button>
          <button class="tab" data-tab="gainers">Gainers</button>
          <button class="tab" data-tab="losers">Losers</button>
        </div>
        <div class="list" id="moversList"></div>
      </section>

      <!-- Live Signals from Discord -->
      <section class="card signals">
        <h2>Live Signals <span class="sub">from Discord</span></h2>
        <div class="list signal-list" id="signalList">
          <div class="empty">等待 Discord 信号...</div>
        </div>
      </section>
    </div>

    <!-- Right Column -->
    <div class="col-right">
      <!-- Sector Heatmap -->
      <section class="card heatmap">
        <h2>Sector Heatmap</h2>
        <div class="heatmap-grid" id="heatmap"></div>
        <div class="heatmap-legend">
          <span>-3%</span>
          <div class="legend-bar"></div>
          <span>+3%</span>
        </div>
      </section>

      <!-- Calendars row -->
      <div class="cal-row">
        <section class="card earnings">
          <h2>Earnings Calendar</h2>
          <div class="list" id="earningsList"></div>
        </section>
        <section class="card economic">
          <h2>Economic Calendar</h2>
          <div class="list" id="economicList"></div>
        </section>
      </div>

      <!-- Latest News -->
      <section class="card news">
        <h2>Latest News</h2>
        <div class="list news-list" id="newsList"></div>
      </section>
    </div>
  </main>

  <footer class="footer">
    Market Pulse + TradeForge · 机器负责速度 · 规则负责风险 · 人保留最终控制权
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
